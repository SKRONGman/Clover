name: Probe Odds API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run probe
        env:
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
        run: python probe_odds.py
      - name: Commit results
        run: |
          git config user.name "clover-bot"
          git config user.email "clover-bot@users.noreply.github.com"
          git add probe_odds.json
          git commit -m "Odds API probe results" || echo "nothing to commit"
          git push
