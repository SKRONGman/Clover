# Refreshes the lines on GitHub's servers so the page is always current.
# Your CFBD_KEY, ODDS_KEY, SUPABASE_URL and SUPABASE_SECRET_KEY live in Settings -> Secrets and variables -> Actions. Never in a file.
#
# Times are UTC. Central time is UTC-5 (CDT) / UTC-6 (CST).
#   Full refresh (ratings + lines): Tuesdays 11:00 UTC = 6am CDT (the page runs
#   on market lines, so team ratings only matter for research - weekly is plenty)
#   Lines only: every hour Thu-Mon, 15:00-05:00 UTC = 10am-midnight CDT
#     (Monday added for Monday Night Football; college + NFL refresh together)
#   Alt lines (DraftKings alternate spreads/totals via the-odds-api.com,
#   spends ODDS_KEY credits, ~2 per game): Thursdays 15:10 UTC = 10:10am CDT.
#     College and NFL every week (NFL was every other week until 2026-09-20; the switch is in odds.py).
# Change the cron lines below to adjust. You can also run it any time from
# the Actions tab -> "Refresh lines" -> "Run workflow".

name: Refresh lines

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full, lines, or alt (lines + DraftKings alternate lines)"
        default: "lines"
  schedule:
    - cron: "0 11 * * 2"                 # full refresh weekly, Tuesday 6am CDT
    - cron: "5 15-23 * * 1,4,5,6,0"      # lines hourly Thu-Mon daytime CDT
    - cron: "5 0-5 * * 1,2,5,6,0"        # ...continuing to midnight CDT (next day UTC)
    - cron: "10 15 * * 4"                # alt lines, Thursday 10:10am CDT

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0 (pinned)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5.6.0 (pinned)
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Decide full vs lines-only
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 11 * * 2" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "10 15 * * 4" ]; then
            echo "mode=alt" >> $GITHUB_OUTPUT
          else
            echo "mode=lines" >> $GITHUB_OUTPUT
          fi

      - name: Run refresh.py
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}                # row 7: bets.py adds closing numbers + grades
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "full" ] || [ ! -f ratings.json ]; then
            python refresh.py
          elif [ "${{ steps.mode.outputs.mode }}" = "alt" ]; then
            python refresh.py --lines-only --alt-lines
          else
            python refresh.py --lines-only
          fi

      - name: Boot the page against the new lines (a bad file never goes live)
        run: node ci/smoke.js . ratings.js --live

      - name: Save the new lines to the repo (this is the history)
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add ratings.js ratings.json results.json health.json cache_*.json || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Lines refresh ($(date -u +'%Y-%m-%d %H:%M UTC'), ${{ steps.mode.outputs.mode }})"
            git push || (git pull --rebase origin main && git push)    # someone pushed code mid-run: replay on top
          fi

      - name: Anything Danny should look at? (red run = GitHub emails him, once a day)
        run: python refresh.py --health-gate
