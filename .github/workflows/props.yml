# NFL player props (props phase step one, rulings of 2026-09-27).
#
# Ruling 5 says DraftKings props are pulled three times per game day. NFL
# kickoffs run from 8:30am to 7:20pm Central on a Sunday, so "two hours before
# kickoff" is a different clock time for every game. This workflow therefore
# runs HOURLY on game days and pulls only the games that have reached one of
# their own marks - a morning sweep, then about 2 hours and about 15 minutes
# before that game's kickoff. props.py tracks which marks a game has had, so a
# game is never pulled twice for the same mark.
#
# Cost: live event odds are markets x regions, and bookmakers do not multiply
# (odds.py). Six markets from DraftKings alone = 6 credits per game per pull,
# so a full NFL week is roughly 325 credits against the 20K plan.
#
# ODDS_KEY lives in Settings -> Secrets and variables -> Actions. Never in a file.
# Times are UTC. Central is UTC-5 (CDT) / UTC-6 (CST).

name: NFL props

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pull (spend credits) or plan (show what would be pulled, spend nothing)"
        default: "plan"
  schedule:
    - cron: "20 13-23 * * 0,1,4"       # Thu/Sun/Mon, 8am-6pm CDT
    - cron: "20 0-4 * * 1,2,5"         # ...through to 11pm CDT (next day UTC)

permissions:
  contents: write

concurrency:
  group: props
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0 (pinned)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5.6.0 (pinned)
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: The shapes still price 2025 the way they were signed off
        run: python props.py --selftest && python props_grade.py

      - name: Pull the due games
        env:
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" = "plan" ]; then
            python props.py --plan
          else
            python props.py --pull
          fi

      - name: Boot the page against the new props (a bad file never goes live)
        run: node ci/smoke_props.js .

      - name: Save the props to the repo
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add props.js props_live.json || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "NFL props ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push || (git pull --rebase origin main && git push)   # a refresh pushed mid-run: replay on top
          fi
